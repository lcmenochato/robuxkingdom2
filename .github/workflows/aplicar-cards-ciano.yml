name: Aplicar cards ciano prontos
on:
  push:
    paths:
      - 'cards-ciano-prontos.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar somente imagens dos cards
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('cards-ciano-prontos.zip') as z:
              for n in ['700','1200','1700','2100','3600','4500','7000','10000']:
                  src=f'images/robux-{n}.jpg'
                  dest=pathlib.Path(f'public/images/robux-{n}.jpg')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(src))
                  print(dest)
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/
          if ! git diff --cached --quiet; then
            git commit -m "Aplicar cards ciano definitivos"
            git push
          fi
