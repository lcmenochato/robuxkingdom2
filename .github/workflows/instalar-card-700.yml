name: Instalar card 700 Robux
on:
  push:
    paths:
      - '1000092627.png'
      - '.github/workflows/instalar-card-700.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar card esgotado
        run: |
          test -f 1000092627.png
          mkdir -p public/images
          cp 1000092627.png public/images/robux-700.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/index.tsx')
          t=p.read_text()
          import re
          t=re.sub(r'/images/robux-700\\.jpg\\?v=[^"]+', '/images/robux-700.png?v=prata-esgotado-20261029', t)
          p.write_text(t)
          PY
      - name: Publicar imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/robux-700.png src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar card de 700 Robux esgotado"
            git push
          fi
