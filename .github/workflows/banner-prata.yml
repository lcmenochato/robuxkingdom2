name: Publicar banner prata Kingdom
on:
  push:
    paths:
      - '1000092431.png'
      - '.github/workflows/banner-prata.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir banner principal
        run: |
          test -f 1000092431.png
          cp 1000092431.png public/images/banner.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/index.tsx')
          t=p.read_text().replace('/images/banner.png?v=ciano-0064956','/images/banner.png?v=prata-20261029')
          p.write_text(t)
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/banner.png src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar banner principal para Kingdom prata"
            git push
          fi
