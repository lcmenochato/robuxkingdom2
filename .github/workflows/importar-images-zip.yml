name: Importar cards do images.zip
on:
  push:
    paths:
      - 'images.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir apenas imagens dos cards
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          nomes = ['700','1200','1700','2100','3600','4500','7000','10000']
          with zipfile.ZipFile('images.zip') as z:
              for num in nomes:
                  origem = f'images/robux-{num}.jpg'
                  destino = pathlib.Path(f'public/images/robux-{num}.jpg')
                  destino.parent.mkdir(parents=True, exist_ok=True)
                  destino.write_bytes(z.read(origem))
                  print('Atualizado', destino)
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/
          if ! git diff --cached --quiet; then
            git commit -m "Substituir imagens dos cards pelo images.zip"
            git push
          fi
